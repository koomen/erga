<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Untitled</title>
  <meta name="color-scheme" content="light dark">
  <script>
    // Resolve the theme before first paint so a dark-mode reload never flashes white.
    (function () {
      var theme = null;
      try { theme = (JSON.parse(localStorage.getItem("scratchwork-editor:settings:v1") || "{}")).theme || null; } catch (e) {}
      if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="fonts/inter.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="page">
    <div id="editor" aria-label="Document"></div>
    <article id="preview" class="prose" hidden aria-label="Rendered preview"></article>
  </main>

  <header class="chrome chrome-top" aria-label="Controls">
    <button type="button" class="icon-btn" id="btn-preview" aria-label="Preview (⌘⇧P)" data-tip="Preview  ⌘⇧P" aria-pressed="false">
      <svg class="i-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.75"/></svg>
      <svg class="i-pen" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-theme" aria-label="Toggle theme (⌘⇧L)" data-tip="Theme  ⌘⇧L">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-help" aria-label="Keyboard shortcuts (⌘/)" data-tip="Shortcuts  ⌘/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.25 9.25a2.75 2.75 0 1 1 3.9 2.5c-.75.35-1.15.95-1.15 1.75v.5"/><circle cx="12" cy="17.25" r=".4" fill="currentColor"/></svg>
    </button>
  </header>

  <footer class="chrome chrome-bottom">
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <button type="button" id="stat" class="stat" aria-label="Word count; click to switch between words, characters and reading time"></button>
  </footer>

  <div id="help" class="help" hidden role="dialog" aria-label="Keyboard shortcuts">
    <dl>
      <dt>Bold</dt><dd><kbd>⌘</kbd><kbd>B</kbd></dd>
      <dt>Italic</dt><dd><kbd>⌘</kbd><kbd>I</kbd></dd>
      <dt>Inline code</dt><dd><kbd>⌘</kbd><kbd>E</kbd></dd>
      <dt>Link</dt><dd><kbd>⌘</kbd><kbd>K</kbd></dd>
      <dt>Heading 1 / 2 / 3</dt><dd><kbd>⌘</kbd><kbd>⌥</kbd><kbd>1</kbd>–<kbd>3</kbd></dd>
      <dt>Plain paragraph</dt><dd><kbd>⌘</kbd><kbd>⌥</kbd><kbd>0</kbd></dd>
      <dt>Preview</dt><dd><kbd>⌘</kbd><kbd>⇧</kbd><kbd>P</kbd></dd>
      <dt>Light / dark</dt><dd><kbd>⌘</kbd><kbd>⇧</kbd><kbd>L</kbd></dd>
      <dt>Hide controls</dt><dd><kbd>Esc</kbd></dd>
    </dl>
    <p>Everything saves to this browser as you type. Select text for bold, italic and link buttons, or paste a URL over it to make a link. ⌘-click a link to open it.</p>
  </div>

  <div id="format-bar" class="format-bar" hidden role="toolbar" aria-label="Formatting">
    <button type="button" id="fmt-bold" aria-label="Bold (⌘B)" title="Bold  ⌘B" aria-pressed="false"><b>B</b></button>
    <button type="button" id="fmt-italic" aria-label="Italic (⌘I)" title="Italic  ⌘I" aria-pressed="false"><i>I</i></button>
    <button type="button" id="fmt-link" aria-label="Link (⌘K)" title="Link  ⌘K" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4L12 5.6"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>
    </button>
    <form id="format-link" class="format-link" hidden>
      <input id="format-url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Paste a link, Enter to apply" aria-label="Link URL">
    </form>
  </div>

  <div id="toast" class="toast" aria-hidden="true"></div>

  <script src="vendor/vendor.js"></script>
  <script src="editor.js"></script>
</body>
</html>
