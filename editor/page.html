<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scratchwork</title>
  <meta name="color-scheme" content="light dark">
  <script>
    // Resolve the theme before first paint so a dark-mode reload never flashes white.
    (function () {
      var theme = null;
      try { theme = (JSON.parse(localStorage.getItem("scratchwork-editor:settings:v1") || "{}")).theme || null; } catch (e) {}
      if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/fonts/inter.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* The page fills the window; the chrome floats over it, as in the Markdown editor. */
    body { overflow: hidden; }
    #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    body.source #frame { visibility: hidden; }
    body.source { overflow: auto; }
    #source[hidden] { display: none; }
    #welcome {
      position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
      color: var(--soft); font-size: 15px; line-height: 1.6; padding: 24px;
    }
    #welcome code { font-family: var(--font-mono); font-size: 0.9em; background: var(--code-bg); border-radius: 4px; padding: 0.1em 0.35em; }
    #welcome[hidden] { display: none; }
    .i-code { display: block; }
    body.source .i-code { display: none; }
    .i-page { display: none; }
    body.source .i-page { display: block; }
    body.source #btn-source { color: var(--chrome-hover); }
  </style>
</head>
<body>
  <iframe id="frame" title="Document" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
  <div id="welcome" hidden></div>
  <main id="source" hidden aria-label="Source"></main>

  <header class="chrome chrome-top" aria-label="Controls">
    <button type="button" class="icon-btn" id="btn-source" aria-label="View source (⌘⇧P)" data-tip="Source  ⌘⇧P" aria-pressed="false">
      <svg class="i-code" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
      <svg class="i-page" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-theme" aria-label="Toggle theme (⌘⇧L)" data-tip="Theme  ⌘⇧L">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-help" aria-label="Keyboard shortcuts (⌘/)" data-tip="Shortcuts  ⌘/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.25 9.25a2.75 2.75 0 1 1 3.9 2.5c-.75.35-1.15.95-1.15 1.75v.5"/><circle cx="12" cy="17.25" r=".4" fill="currentColor"/></svg>
    </button>
  </header>

  <footer class="chrome chrome-bottom">
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <button type="button" id="stat" class="stat" aria-label="Word count; click to switch between words, characters and reading time"></button>
  </footer>

  <div id="help" class="help" hidden role="dialog" aria-label="Keyboard shortcuts">
    <dl>
      <dt>Bold</dt><dd><kbd>⌘</kbd><kbd>B</kbd></dd>
      <dt>Italic</dt><dd><kbd>⌘</kbd><kbd>I</kbd></dd>
      <dt>New paragraph</dt><dd><kbd>Enter</kbd></dd>
      <dt>Line break</dt><dd><kbd>⇧</kbd><kbd>Enter</kbd></dd>
      <dt>Undo / redo</dt><dd><kbd>⌘</kbd><kbd>Z</kbd> / <kbd>⌘</kbd><kbd>⇧</kbd><kbd>Z</kbd></dd>
      <dt>View source</dt><dd><kbd>⌘</kbd><kbd>⇧</kbd><kbd>P</kbd></dd>
      <dt>Light / dark</dt><dd><kbd>⌘</kbd><kbd>⇧</kbd><kbd>L</kbd></dd>
      <dt>Hide controls</dt><dd><kbd>Esc</kbd></dd>
    </dl>
    <p>Click into any text on the page and type. Edits are written to the file on disk as you go. ⌘-click a link to open it.</p>
  </div>

  <div id="toast" class="toast" aria-hidden="true"></div>

  <script src="/page.js"></script>
</body>
</html>
