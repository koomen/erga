<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Queue</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ecebe5; --card: #ffffff; --ink: #1d1c1a; --muted: #6f6c64; --line: #dcd9d0;
    --accent: #2f5bd3; --ok: #1f7a4d; --warn: #b26a00; --bad: #b3261e; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1d1d1b; --card: #252523; --ink: #ecebe6; --muted: #9a978e; --line: #34332f;
      --accent: #7ea0ff; --ok: #4cc38a; --warn: #f0a742; --bad: #ff7b72; --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 18px 24px 8px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .live { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .live.on::before { background: var(--ok); }
  header a { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)) minmax(240px, 1.1fr); gap: 14px; padding: 10px 24px 24px; align-items: start; }
  #cols { display: contents; }
  @media (max-width: 1150px) { main { grid-template-columns: repeat(3, minmax(220px, 1fr)); } }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 10px 16px; } header { padding: 16px; } }
  .col { background: var(--panel); border-radius: 10px; padding: 10px; min-height: 120px; }
  .col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 2px 4px 10px; display: flex; justify-content: space-between; }
  .empty { color: var(--muted); font-size: 12px; padding: 8px 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; }
  .card:hover { border-color: var(--muted); }
  .card.failed { border-left: 3px solid var(--bad); }
  .card.merging { border-left: 3px solid var(--warn); }
  .col.merging h2 .n.busy { color: var(--warn); }
  .col.merging h2 .n.busy::before { content: ""; display: inline-block; vertical-align: -1px; margin-right: 6px; width: 8px; height: 8px; border: 2px solid var(--warn); border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; }
  .card.merging .last { color: var(--warn); }
  .card.discarded { opacity: .55; }
  .top { display: flex; gap: 8px; align-items: baseline; }
  .id { color: var(--muted); font: 12px ui-monospace, monospace; }
  .title { font-weight: 600; flex: 1; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .meta code { font: 11px ui-monospace, monospace; }
  .last { color: var(--muted); font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .err { color: var(--bad); font-size: 12px; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 7.5em; overflow: hidden; }
  .thumbs { display: flex; gap: 6px; margin-top: 8px; overflow: hidden; }
  .thumbs img { height: 54px; border-radius: 4px; border: 1px solid var(--line); object-fit: cover; max-width: 96px; }
  .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  button, .btn { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  button:hover, .btn:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button.confirm { background: var(--bad); border-color: var(--bad); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.up { background: var(--ok); }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--warn); border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .dlg { padding: 18px 22px 22px; }
  .dlg-head { display: flex; align-items: flex-start; gap: 12px; }
  .dlg h3 { margin: 0; font-size: 18px; line-height: 1.3; flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .dlg h3 .id { font-size: 14px; }
  .status { font: 600 11px/1 ui-sans-serif, -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 999px; border: 1px solid currentColor; color: var(--muted); white-space: nowrap; }
  .status.working { color: var(--accent); }
  .status.complete, .status.merged { color: var(--ok); }
  .status.merging { color: var(--warn); }
  .status.failed { color: var(--bad); }
  .branch { font: 12px ui-monospace, monospace; color: var(--muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .links { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 8px; font-size: 13px; }
  .links a, .links button.link { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .links a:hover, .links button.link:hover { text-decoration: underline; }
  .links .muted, .links code { color: var(--muted); font-size: 12px; }
  button.link { border: 0; background: none; padding: 0; font: inherit; cursor: pointer; }
  .copied { color: var(--ok) !important; }
  .dlg section { margin-top: 18px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
  .text.clamp { max-height: 9em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .more { margin-top: 4px; font-size: 12px; color: var(--accent); }
  .dlg h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  .shots { display: grid; gap: 12px; }
  .shots figure { margin: 0; }
  .shots img { width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .shots figcaption { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .log { font: 12px/1.5 ui-monospace, monospace; max-height: 260px; overflow: auto; background: var(--panel); border-radius: 6px; padding: 8px 10px; }
  .log div { white-space: pre-wrap; overflow-wrap: anywhere; }
  .log time { color: var(--muted); margin-right: 8px; }
  .close { flex: none; }
  a { color: var(--accent); }

  /* Branches: main's latest commits, one dot each, newest at the top. The left lane is local main
     (every commit), the right one origin/main: a filled dot where it has the commit, a hollow one where
     it doesn't yet. A task's merge commit shows the task, and opens it. This is where merged tasks go. */
  :root { --lane-local: var(--ink); --lane-origin: var(--ok); --row: 24px; --hl: rgba(47,91,211,.10); }
  @media (prefers-color-scheme: dark) { :root { --hl: rgba(126,160,255,.14); } }
  .col.branches h2 .n.unpushed { color: var(--warn); }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted); margin: -4px 4px 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--lane-local); }
  .legend i.o { background: var(--lane-origin); }
  .graph { list-style: none; margin: 0; padding: 0; -webkit-mask-image: linear-gradient(#000 calc(100% - 5 * var(--row)), transparent); mask-image: linear-gradient(#000 calc(100% - 5 * var(--row)), transparent); }
  .graph li { display: flex; align-items: center; height: var(--row); border-radius: 5px; overflow: hidden; transition: height .35s ease, opacity .35s ease, background-color .15s; }
  .graph li.enter, .graph li.leave { height: 0; opacity: 0; }
  .graph li.task { cursor: pointer; }
  .graph li.task:hover { background: var(--hl); }
  .lane { position: relative; width: 16px; height: 100%; flex: none; }
  .lane::before, .lane::after { content: ""; position: absolute; left: 7px; width: 2px; height: 50%; background: var(--lane-local); opacity: .35; display: none; }
  .lane::before { top: 0; } .lane::after { bottom: 0; }
  .lane.up::before, .lane.down::after { display: block; }
  .lane.o::before, .lane.o::after { background: var(--lane-origin); opacity: .5; }
  .lane i { position: absolute; left: 4px; top: calc(50% - 4px); width: 8px; height: 8px; border-radius: 50%; background: var(--lane-local); z-index: 1; transition: background-color .4s, box-shadow .4s, transform .15s; }
  .lane.o i { background: var(--lane-origin); }
  .lane.o.no i { background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--warn); }
  .graph .sub { flex: 1; min-width: 0; padding: 0 6px 0 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .graph li.task .sub { color: var(--ink); }
  .graph .sub b { font: 600 11px ui-monospace, monospace; color: var(--muted); margin-right: 4px; }
  .graph li.task:hover .sub b { color: var(--accent); }
  #tip { position: fixed; z-index: 6; pointer-events: none; max-width: 340px; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 7px 10px; font-size: 12px; display: none; }
  #tip .s { font-weight: 600; overflow-wrap: anywhere; }
  #tip .m { color: var(--muted); margin-top: 2px; font-size: 11px; }
  #tip code { font: 11px ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <h1>Task Queue</h1>
  <span class="live" id="live">connecting</span>
  <a href="/api" target="_blank">API</a>
</header>
<main id="board"><div id="cols"></div><section class="col branches" data-col="branches"><h2><span>Branches</span><span class="n" id="branches-n"></span></h2><div class="legend"><span><i></i>main</span><span><i class="o"></i>origin/main</span></div><ol class="graph" id="graph"></ol></section></main>
<div id="tip"></div>
<dialog id="dlg"></dialog>
<script>
const COLUMNS = [
  { title: "Queued", statuses: ["queued"] },
  { title: "Working", statuses: ["working", "failed"] },
  { title: "Ready to merge", statuses: ["complete"] },
  { title: "Merging", statuses: ["merging"] },
]; // then Branches: main's latest commits, where merged tasks show (renderBranches)
let tasks = [];
let history = { commits: [], tasks: {}, unpushed: 0, behind: 0, origin: false };
let openId = null;
const armed = new Set(); // discard buttons clicked once, waiting for the second click

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : new Date(iso).toLocaleDateString();
};

function actions(t, inDialog = false) {
  const b = [];
  if (t.url && !inDialog && !["merged", "discarded"].includes(t.status)) b.push(`<a class="btn" href="${esc(t.url)}" target="_blank" onclick="event.stopPropagation()"><span class="dot ${t.previewUp ? "up" : ""}" title="${t.previewUp ? "preview is up" : "preview is down"}"></span>Open</a>`);
  if (t.port && t.worktree && !t.previewUp && ["working", "complete", "failed"].includes(t.status)) b.push(`<button data-act="preview" data-id="${t.id}">Start preview</button>`);
  if (t.status == "complete") b.push(`<button class="primary" data-act="merge" data-id="${t.id}">Merge</button>`);
  if (t.status == "merging") b.push(`<button disabled><span class="spin"></span> ${t.log.at(-1)?.message.startsWith("Merge requested: waiting") ? "Waiting to merge…" : "Merging…"}</button>`);
  if (!["merging", "merged", "discarded"].includes(t.status))
    b.push(armed.has(t.id) ? `<button class="confirm" data-act="discard" data-id="${t.id}">Discard branch?</button>` : `<button class="danger" data-act="arm" data-id="${t.id}">Discard</button>`);
  return b.length ? `<div class="actions">${b.join("")}</div>` : "";
}

function card(t) {
  const last = t.log[t.log.length - 1];
  const thumbs = t.screenshots.slice(-3).map((s) => `<img src="/shots/${esc(s.file)}" alt="${esc(s.caption)}" loading="lazy">`).join("");
  return `<div class="card ${t.status}" data-open="${t.id}">
    <div class="top"><span class="id">#${t.id}</span><span class="title">${esc(t.title)}</span></div>
    <div class="meta">${t.branch ? `<code>${esc(t.branch)}</code>` : ""}<span>${t.status == "merged" ? `merged ${ago(t.mergedAt)}` : t.status == "merging" ? `merging · ${ago(t.updatedAt)}` : ago(t.updatedAt)}</span>${t.status == "failed" ? "<span>failed</span>" : ""}${t.status == "discarded" ? "<span>discarded</span>" : ""}</div>
    ${t.error ? `<div class="err">${esc(t.error)}</div>` : last && !["merged", "discarded"].includes(t.status) ? `<div class="last">${esc(last.message)}</div>` : ""}
    ${thumbs && t.status != "discarded" ? `<div class="thumbs">${thumbs}</div>` : ""}
    ${actions(t)}
  </div>`;
}

/** When a merging task's merge was asked for: they run one at a time, in that order. */
const requested = (t) => t.log.findLast((l) => l.message.startsWith("Merge requested"))?.at ?? t.updatedAt;

function render() {
  document.getElementById("cols").innerHTML = COLUMNS.map((c) => {
    let list = tasks.filter((t) => c.statuses.includes(t.status));
    // Newest activity first; done things keep only the latest. Merges go in the order they were asked for (one at a time).
    if (c.title == "Merging") list.sort((a, b) => requested(a).localeCompare(requested(b)) || a.id - b.id);
    else list.sort((a, b) => (b.mergedAt ?? b.updatedAt).localeCompare(a.mergedAt ?? a.updatedAt));
    const slug = c.title.toLowerCase().replace(/\W+/g, "-");
    return `<section class="col ${slug}" data-col="${slug}"><h2><span>${c.title}</span><span class="n ${c.title == "Merging" && list.length ? "busy" : ""}">${list.length}</span></h2>${list.map(card).join("") || `<div class="empty">Nothing here</div>`}</section>`;
  }).join("");
  if (openId != null) renderDialog();
}

// ---- Branches ----------------------------------------------------------------

let drawn = false; // the first draw doesn't animate

/** Keeps one row per commit, so a new commit slides in at the top and the oldest fades out at the bottom. */
function renderBranches() {
  const graph = document.getElementById("graph");
  const rows = new Map([...graph.children].filter((li) => !li.classList.contains("leave")).map((li) => [li.dataset.sha, li]));
  const want = new Set(history.commits.map((c) => c.sha));
  for (const [sha, li] of rows) if (!want.has(sha)) {
    if (!drawn) { li.remove(); continue; }
    li.classList.add("leave");
    setTimeout(() => li.remove(), 400);
  }
  let prev = null;
  const cs = history.commits;
  cs.forEach((c, i) => {
    let li = rows.get(c.sha);
    const fresh = !li;
    if (fresh) { li = document.createElement("li"); li.dataset.sha = c.sha; if (drawn) li.classList.add("enter"); }
    const t = c.task != null ? tasks.find((x) => x.id == c.task) : null;
    const label = c.task != null ? `<b>#${c.task}</b>${esc(t?.title ?? c.subject.replace(/^Merge [^:]*:\s*/, ""))}` : esc(c.subject);
    const up = i > 0, oUp = c.remote && cs[i - 1]?.remote, oDown = c.remote && (cs[i + 1]?.remote ?? true);
    li.innerHTML = `<span class="lane l ${up ? "up" : ""} down"><i></i></span><span class="lane o ${c.remote ? "" : "no"} ${oUp ? "up" : ""} ${oDown ? "down" : ""}"><i></i></span><span class="sub">${label}</span>`;
    li.classList.toggle("task", c.task != null);
    li.classList.toggle("remote", c.remote);
    if (c.task != null) li.dataset.open = c.task; else delete li.dataset.open;
    graph.insertBefore(li, prev ? prev.nextSibling : graph.firstChild);
    if (fresh && drawn) { li.offsetHeight; li.classList.remove("enter"); }
    prev = li;
  });
  drawn = true;
  const n = document.getElementById("branches-n");
  n.textContent = !history.origin ? "no origin" : [history.unpushed ? `${history.unpushed} not pushed` : "pushed", history.behind ? `origin +${history.behind}` : ""].filter(Boolean).join(" · ");
  n.classList.toggle("unpushed", !!history.unpushed);
}

const tip = document.getElementById("tip");
function showTip(li) {
  const c = history.commits.find((x) => x.sha == li?.dataset.sha);
  if (!c) { tip.style.display = "none"; return; }
  tip.innerHTML = `<div class="s">${esc(c.subject)}</div><div class="m"><code>${esc(c.short)}</code> · ${ago(c.at)} · ${c.remote ? "on origin/main" : "local only, not pushed yet"}</div>`;
  tip.style.display = "block";
  const r = li.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
  tip.style.top = `${r.bottom + 4}px`;
}
document.addEventListener("mouseover", (e) => showTip(e.target.closest?.("#graph li")));
document.addEventListener("scroll", () => showTip(null), true);

let dlgError = null; // {id, msg}: a Merge or Discard request from the detail view that failed
const STATUS = { queued: "Queued", working: "Working", complete: "Ready to merge", merging: "Merging", merged: "Merged", failed: "Failed", discarded: "Discarded" };
const expanded = new Set(); // "<id>:ask" / "<id>:summary" texts shown in full
/** The ask or the summary: a few lines, with "Show all" when it runs longer. */
function textSection(t, key, title, text) {
  const k = `${t.id}:${key}`;
  const long = text.length > 600 || text.split("\n").length > 7;
  const open = !long || expanded.has(k);
  return `<section><h4>${title}</h4><div class="text ${open ? "" : "clamp"}">${esc(text.trim())}</div>${long ? `<button class="link more" data-act="more" data-key="${k}">${open ? "Show less" : "Show all"}</button>` : ""}</section>`;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {
    const ta = Object.assign(document.createElement("textarea"), { value: text });
    document.getElementById("dlg").append(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}

function renderDialog() {
  const t = tasks.find((x) => x.id == openId);
  const dlg = document.getElementById("dlg");
  if (!t) { dlg.close(); return; }
  const log = dlg.querySelector(".log");
  const atBottom = !log || log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  const scroll = dlg.scrollTop;
  const live = !["merged", "discarded"].includes(t.status);
  const links = [
    t.worktree && live ? `<button class="link" data-act="copy" data-text="${esc(t.worktree)}" title="Copy ${esc(t.worktree)}">worktree</button>` : "",
    t.url && live ? `<a href="${esc(t.url)}" target="_blank" title="${esc(t.url)}"><span class="dot ${t.previewUp ? "up" : ""}"></span>preview</a>${t.previewUp ? "" : ` <span class="muted">(not running)</span>`}` : "",
    t.commit ? `<code>${esc(t.commit)}</code>` : "",
  ].filter(Boolean);
  dlg.innerHTML = `<div class="dlg">
    <div class="dlg-head">
      <h3><span><span class="id">#${t.id}</span> ${esc(t.title)}</span><span class="status ${t.status}">${STATUS[t.status] ?? esc(t.status)}</span></h3>
      <button class="close" data-act="close">Close</button>
    </div>
    ${t.branch ? `<div class="branch" title="${esc(t.branch)}">${esc(t.branch)}</div>` : ""}
    ${links.length ? `<div class="links">${links.join("")}</div>` : ""}
    ${actions(t, true)}
    ${dlgError?.id == t.id ? `<div class="err" style="max-height:none">${esc(dlgError.msg)}</div>` : ""}
    ${t.error ? `<section><h4>Error</h4><div class="err" style="max-height:none">${esc(t.error)}</div></section>` : ""}
    ${t.description ? textSection(t, "ask", "Ask", t.description) : ""}
    ${t.summary ? textSection(t, "summary", "Summary", t.summary) : ""}
    ${t.screenshots.length ? `<section><h4>Screenshots</h4><div class="shots">${t.screenshots.map((s) => `<figure><img src="/shots/${esc(s.file)}" alt="${esc(s.caption)}">${s.caption ? `<figcaption>${esc(s.caption)}</figcaption>` : ""}</figure>`).join("")}</div></section>` : ""}
    <section><h4>Log</h4><div class="log">${t.log.map((l) => `<div><time>${new Date(l.at).toLocaleTimeString()}</time>${esc(l.message)}</div>`).join("")}</div></section>
  </div>`;
  const nl = dlg.querySelector(".log");
  if (atBottom) nl.scrollTop = nl.scrollHeight;
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = scroll;
}

/** POSTs; on failure shows the error and returns it (null when it went through). */
async function post(path, body) {
  let msg = null;
  try {
    const res = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
    if (!res.ok) { const { error } = await res.json().catch(() => ({})); msg = error || res.statusText || `HTTP ${res.status}`; }
  } catch (e) { msg = `Request failed: ${e.message}`; }
  if (msg) showError(msg);
  return msg;
}
function showError(msg) {
  const el = document.getElementById("live");
  el.textContent = msg; el.style.color = "var(--bad)";
  setTimeout(() => { el.style.color = ""; el.textContent = "live"; }, 6000);
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (btn) {
    e.stopPropagation();
    const id = Number(btn.dataset.id);
    const act = btn.dataset.act;
    if (act == "copy") { copy(btn.dataset.text).then((ok) => { btn.textContent = ok ? "copied" : "couldn't copy"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = "worktree"; btn.classList.remove("copied"); }, 1500); }); }
    if (act == "more") { const k = btn.dataset.key; expanded.has(k) ? expanded.delete(k) : expanded.add(k); renderDialog(); }
    if (act == "close") { openId = null; document.getElementById("dlg").close(); }
    if (act == "preview") { btn.disabled = true; post(`/api/tasks/${id}/preview`); }
    if (act == "arm") { armed.add(id); render(); setTimeout(() => { armed.delete(id); render(); }, 4000); }
    if (act == "merge" || act == "discard") {
      // From the detail view: close it once the request goes through (the board shows the rest), or keep it open with the error.
      const inDialog = !!btn.closest("#dlg");
      armed.delete(id); btn.disabled = true;
      post(`/api/tasks/${id}/${act}`).then((msg) => {
        if (!inDialog || openId != id) return;
        if (msg) { dlgError = { id, msg }; renderDialog(); } else { openId = null; document.getElementById("dlg").close(); } // openId first: an update before the close event would reopen it
      });
    }
    return;
  }
  const c = e.target.closest("[data-open]");
  if (c) { openId = Number(c.dataset.open); renderDialog(); }
});
document.getElementById("dlg").addEventListener("close", () => { openId = null; dlgError = null; });
document.getElementById("dlg").addEventListener("click", (e) => { if (e.target.id == "dlg") e.target.close(); });

function connect() {
  const live = document.getElementById("live");
  const es = new EventSource("/api/events");
  es.addEventListener("tasks", (e) => { tasks = JSON.parse(e.data); render(); renderBranches(); });
  es.addEventListener("history", (e) => { history = JSON.parse(e.data); render(); renderBranches(); });
  es.onopen = () => { live.textContent = "live"; live.classList.add("on"); };
  es.onerror = () => { live.textContent = "reconnecting"; live.classList.remove("on"); };
}
connect();
setInterval(render, 30000); // keep "5m ago" fresh
</script>
