<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Views</title>
<style>
  body { margin: 0; background: #fff; color: #111; font: 16px/1.4 sans-serif; }
  main { max-width: 40rem; margin: 0 auto; padding: 48px 16px; }
  .branch { list-style: none; margin: 0; padding: 0 0 0 20px; }
  .branch > li { padding: 8px 0 8px 24px; border-left: 1.5px solid #ddd; }
  .view { display: inline-grid; gap: 4px; min-width: 240px; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 12px; }
  h3, p { margin: 0; }
  .url { font: 13px monospace; color: #e2480f; }
</style>
</head>
<body>
<main>
  <h1>Views</h1>
  <ul class="branch" data-erga-list="view">
    <li>
      <div class="view"><h3>Front</h3><p class="url">/</p></div>
    </li>
    <li>
      <div class="view"><h3>Docs</h3><p class="url">/docs</p></div>
      <ul class="branch" data-erga-list="view">
        <li>
          <div class="view"><h3>New</h3><p class="url">/new</p></div>
        </li>
      </ul>
    </li>
    <li>
      <div class="view"><h3>Settings</h3><p class="url">/settings</p></div>
    </li>
  </ul>
  <template data-erga-item="view">
    <li>
      <div class="view"><h3>New view</h3><p class="url">/path</p></div>
    </li>
  </template>
</main>
</body>
</html>
