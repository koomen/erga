<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spaces at the ends of blocks</title>
  <style>body { font: 18px/1.5 Georgia, serif; max-width: 40rem; margin: 3rem auto; }</style>
</head>
<body>
  <main>
    <h1>Spaces at the ends of blocks</h1>
    <p id="spaces">Three spaces at the end   </p>
    <p id="after-spaces">The next block</p>
    <p id="nbsp">Two no-break spaces at the end&nbsp;&nbsp;</p>
    <p id="after-nbsp">The block after them</p>
    <p id="br">Spaces before a break   <br>and a second line</p>
    <p id="after-br">The block after the break</p>
    <p id="lead">  Two spaces at the start</p>
    <p id="pretty">
      Text that the source indents
    </p>
    <p id="after-pretty">The block after the indented text</p>
  </main>
</body>
</html>
