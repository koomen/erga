<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script type="module" src="/erga/steps/editor.js"></script>
<title>Builds</title>
<style>
  body { background: #fff; font: 20px/1.5 sans-serif; margin: 0; }
  .slide { display: none; padding: 60px; }
  .slide.current { display: block; }
  .build:not(.shown) { display: none; }
  /* How far into the deck: it grows to each step's place in 1.5 s. */
  #progress { position: fixed; left: 0; bottom: 0; height: 24px; width: 0; background: rgb(200, 0, 0); transition: width 1.5s linear; }
</style>
</head>
<body>
  <section class="slide"><h1>First slide</h1><p class="build">One.</p><p class="build">Two.</p><p class="build">Three.</p></section>
  <section class="slide"><h1>Second slide</h1><p class="build">No parts here.</p></section>
  <section class="slide"><h1>Third slide</h1><p class="build">Red.</p><p class="build">Green.</p><p class="build">Blue.</p></section>
  <div id="progress"></div>
  <script>
    // A deck whose slides build up in parts (libs/steps/ui/steps.ts, Steps): each part is a step, and
    // slide(n) says which slide step n is on. The address names the slide and the part: #3.2 (rule 11).
    const slides = [...document.querySelectorAll(".slide")];
    const steps = slides.flatMap((s, i) => [...s.querySelectorAll(".build")].map((_, k) => [i, k + 1])); // [slide, part]
    const shown = (n) => [...slides[steps[n][0]].querySelectorAll(".build")].slice(0, steps[n][1]);
    let at = 0;
    function show(n) {
      at = Math.max(0, Math.min(steps.length - 1, n));
      const [i, k] = steps[at];
      slides.forEach((s, j) => s.classList.toggle("current", j == i));
      slides[i].querySelectorAll(".build").forEach((b, j) => b.classList.toggle("shown", j < k));
      document.getElementById("progress").style.width = (100 * (at + 1) / steps.length) + "%";
      history.replaceState(null, "", "#" + (i + 1) + (k > 1 ? "." + k : ""));
      dispatchEvent(new Event("ergastep"));
    }
    window.ergaSteps = {
      count: () => steps.length,
      current: () => at,
      go: show,
      slide: (n) => steps[n][0],
      label: (n) => slides[steps[n][0]].querySelector("h1").textContent,
      // A picture of step n: the slide's title and the parts shown so far.
      image(n, { width, height }) {
        const c = document.createElement("canvas");
        c.width = width; c.height = height;
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, width, height);
        g.fillStyle = "#000"; g.font = `bold ${height / 7}px sans-serif`;
        g.fillText(slides[steps[n][0]].querySelector("h1").textContent, width / 10, height / 4);
        g.font = `${height / 9}px sans-serif`;
        shown(n).forEach((p, j) => g.fillText(p.textContent, width / 10, height / 4 + (j + 1) * height / 6));
        return c;
      },
    };
    const [i, k] = location.hash.slice(1).split(".");
    show(Math.max(0, steps.findIndex(([s, p]) => s == (i || 1) - 1 && p == (k || 1))));
  </script>
</body>
</html>
