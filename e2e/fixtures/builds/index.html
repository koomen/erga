<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Builds</title>
<style>
  body { background: #fff; font: 20px/1.5 sans-serif; margin: 0; }
  .slide { display: none; padding: 60px; }
  .slide.current { display: block; }
  .build:not(.shown) { display: none; }
</style>
</head>
<body>
  <section class="slide"><h1>First slide</h1><p class="build shown">One.</p><p class="build">Two.</p><p class="build">Three.</p></section>
  <section class="slide"><h1>Second slide</h1><p class="build shown">No parts here.</p></section>
  <section class="slide"><h1>Third slide</h1><p class="build shown">Red.</p><p class="build">Green.</p><p class="build">Blue.</p></section>
  <script>
    // A deck whose slides build up in parts (agents/document/PROMPT.md, "Presentations"): → shows a slide's next part,
    // then the next slide; ← hides the last part shown, then goes to the slide before, all its parts shown. The
    // address names the slide and the part: #3.2 (rule 14).
    const slides = [...document.querySelectorAll(".slide")];
    const parts = (i) => slides[i].querySelectorAll(".build").length;
    let at = 0, part = 1;
    function show(i, k) {
      at = Math.max(0, Math.min(slides.length - 1, i));
      part = Math.max(1, Math.min(parts(at), k));
      slides.forEach((s, j) => s.classList.toggle("current", j == at));
      slides[at].querySelectorAll(".build").forEach((b, j) => b.classList.toggle("shown", j < part));
      history.replaceState(null, "", "#" + (at + 1) + (part > 1 ? "." + part : ""));
      dispatchEvent(new Event("ergastep"));
    }
    window.ergaSteps = {
      count: () => slides.length,
      current: () => at,
      label: (i) => slides[i].querySelector("h1").textContent,
      go: (i) => show(i, 1),
      next: () => (part < parts(at) ? show(at, part + 1) : at < slides.length - 1 && show(at + 1, 1)),
      back: () => (part > 1 ? show(at, part - 1) : at > 0 && show(at - 1, Infinity)),
      hasNext: () => at < slides.length - 1 || part < parts(at),
      hasBack: () => at > 0 || part > 1,
    };
    const [i, k] = location.hash.slice(1).split(".");
    show((i || 1) - 1, k || 1);
  </script>
</body>
</html>
