[package]
name = "erga"
version = "0.1.0"
edition = "2021"
description = "Erga's helper: it attaches an agent's session (Claude Code) to its person's agent panel."
license = "MIT"
publish = false

[[bin]]
name = "erga"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
