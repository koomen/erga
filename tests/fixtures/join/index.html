<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joining blocks</title>
  <style>body { font: 18px/1.5 Georgia, serif; max-width: 40rem; margin: 3rem auto; }</style>
</head>
<body>
  <main>
    <h1>Joining blocks</h1>
    <p id="alpha">Press Backspace at the <em>start</em></p>
    <p id="beta">of a paragraph to join it.</p>
    <h2 id="head">A heading</h2>
    <p id="gamma">keeps its own type.</p>
    <ul>
      <li id="one">Item one</li>
      <li id="two">Item two</li>
    </ul>
    <p id="after">after the list.</p>
    <blockquote>
      <p id="quoted">A quote</p>
    </blockquote>
    <figure>
      <svg width="40" height="20"><rect width="40" height="20" fill="#7fb6e0"/></svg>
      <figcaption id="cap">A caption</figcaption>
    </figure>
  </main>
</body>
</html>
